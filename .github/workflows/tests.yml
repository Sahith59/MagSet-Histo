name: Research pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.15.2 scikit-learn==1.6.1 Pillow==11.1.0
      - name: Run data, protocol, and baseline checks
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/sync_cluster.sh slurm/*.sbatch
